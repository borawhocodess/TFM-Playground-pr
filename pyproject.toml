[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "tfmplayground"
version = "0.0.1"
authors = [
    { name = "Alexander Pfefferle", email = "pfeffera@cs.uni-freiburg.de" },
]
description = "A Playground for Tabular Foundation Models"
readme = "README.md"
requires-python = "==3.12.*"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = { file = "LICENSE" }
dependencies = [
    "torch==2.9",
    "numpy>=2.0.2",
    "h5py>=3",
    "requests>=2",
    "pandas",
    "scikit-learn>=1.5",
    "schedulefree>=1.4",
    "tqdm",
    "pfns==0.3.0",
    "openml==0.15.1",
    "interpret-core",  # undeclared ticl dependency, ticl/__init__ fails to import without it
    # pinned to the commit this repo was reviewed against, not main: the regression flag is in no
    # release yet, and an unpinned branch moves under you. the version string cannot tell you
    # which you have, they never bumped it, so external_priors/tabicl.py checks the signature
    "tabicl[pretrain] @ git+https://github.com/soda-inria/tabicl.git@8f1aa2098c894ab91dba15209cf2002ba4be6c6c",
    "ticl @ git+https://github.com/microsoft/ticl.git@main",
    "tabpfn-v1-prior @ git+https://github.com/automl/tabpfn-v1-prior.git",
    "mlflow",
    "wandb>=0.20",
]

[project.optional-dependencies]
tensorboard = ["tensorboard>=2.19"]
[project.urls]
Homepage = "https://github.com/automl/TFM-Playground"
Issues = "https://github.com/automl/TFM-Playground/issues"

[tool.setuptools]
packages = { find = { include = ["tfmplayground*"] } }

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]
ignore = [
    "E741",  # ambiguous variable name
]

[tool.ruff.lint.per-file-ignores]
"tfmplayground/models/nanotabfm.py" = [
    "F401",   # unused import
    "UP006",  # non-pep585 annotation
    "UP035",  # deprecated import
    "SIM108", # if-else block instead of if-exp
]
"tfmplayground/models/nanotabicl.py" = [
    "E401",  # multiple imports on one line
    "I001",  # unsorted imports
    "UP045", # non-pep604 annotation optional
]
"tfmplayground/priors/nanotabicl.py" = [
    "B905",  # zip without an explicit strict
    "E401",  # multiple imports on one line
    "E501",  # line too long
    "I001",  # unsorted imports
]
"tfmplayground/priors/scm.py" = [
    "E501", # line too long
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
exclude = ["tfmplayground/models/nanotabfm.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "ruff>=0.15.10",
    "pytest>=8",
]
